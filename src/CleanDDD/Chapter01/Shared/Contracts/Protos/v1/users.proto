syntax = "proto3";

package cleanddd.users.v1;
import "google/api/annotations.proto";
option csharp_namespace = "CleanDDD.Contracts.Users.v1";

service UserService {
  rpc GetUser (GetUserRequest) returns (GetUserResponse)
  {
      option (google.api.http) = {
        get: "/v1/users/{user_id}"
      };
  }
  rpc GetUsers (GetUsersRequest) returns (GetUsersResponse)
  {
      option (google.api.http) = {
          get: "/v1/users"
      };
  }
  rpc GetUserByEmail (GetUserByEmailRequest) returns (GetUserByEmailResponse)
  {
      option (google.api.http) = {
          get: "/v1/users:byEmail"
          additional_bindings {
              get: "/v1/users/byEmail"
          }
      };
  }
}

// Queries
message GetUserRequest { string user_id = 1; }
message GetUserResponse { User user = 1; }

message GetUsersRequest { }
message GetUsersResponse { repeated User items = 1;}

message GetUserByEmailRequest { string email = 1; }
message GetUserByEmailResponse { User user = 1; }

// View
message User {
  string user_id = 1;
  string name    = 2;
  string email   = 3;
  bool   is_active = 4;
}